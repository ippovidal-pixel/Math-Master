<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MathMaster: Academic Portal</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1739/1739515.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
                950: '#172554',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
      }
      body {
        font-family: 'Inter', 'system-ui', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        overflow-x: hidden;
        overscroll-behavior: none;
      }
      #root {
        min-height: 100vh;
      }
      .safe-pt { padding-top: var(--sat); }
      .safe-pb { padding-bottom: var(--sab); }
      
      .academic-card {
        background: white;
        border: 1px solid #e2e8f0;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        border-radius: 12px;
      }
      
      @media print {
        body { background-color: white !important; }
        .no-print { display: none !important; }
        @page { margin: 1cm; }
      }
      
      * { -webkit-tap-highlight-color: transparent; }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div class="min-h-screen flex items-center justify-center">
  <div class="academic-card p-6 max-w-md text-center">
    <h1 class="text-2xl font-bold text-brand-800">
      MathMaster
    </h1>
    <p class="mt-2 text-slate-600">
      Your site is now working on GitHub Pages 🎉
    </p>
  </div>
</div>
    <script>
      /**
       * Service Worker Registration Logic
       * Defensive implementation to handle sandboxed/preview environments.
       */
      (function() {
        const isSandbox = window.location.hostname.includes('usercontent.goog') || 
                          window.location.hostname.includes('ai.studio');
        
        if ('serviceWorker' in navigator && !isSandbox && window.isSecureContext) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('MathMaster SW Registered:', reg.scope))
              .catch(err => console.debug('MathMaster SW skipped (likely cross-origin restriction).'));
          });
        } else {
          console.log('MathMaster: Service Worker disabled for this environment (sandbox detected).');
        }
      })();
    </script>
  </body>
</html>
